# 영어 한 걸음 APK 자동 빌드.
# main에 푸시하면 APK를 만들어 공개 릴리스에 올린다. 친구들은 아래 고정 링크로 받는다(로그인 불필요).
#   https://github.com/zent1216/english-step/releases/latest/download/english_step.apk
name: APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write  # 릴리스에 APK를 올리기 위해 필요

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Play 업로드 키(Secrets)가 등록돼 있으면 Play용 AAB도 만든다(지금은 안 씀).
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' && secrets.UPLOAD_KEYSTORE_PASSWORD != '' }}
      # leakcall 저장소에서 빌드하던 번호(10까지)를 이어서 쓴다. 폰에 깔린 앱보다 번호가 낮으면 업데이트가 거부된다.
      BUILD_OFFSET: 10
    steps:
      # 기본 러너 디스크가 빠듯해서(ML Kit·음성 인식 포함 빌드) 안 쓰는 도구를 지워 공간 확보
      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 집 PC와 같은 Flutter 버전
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: 빌드 번호 정하기
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + BUILD_OFFSET ))" >> "$GITHUB_ENV"

      # 요즘 폰(arm64)용만 빌드한다(구형 32비트폰 미지원).
      - run: flutter build apk --release --target-platform android-arm64 --build-number=$BUILD_NUMBER

      - name: Play 업로드용 AAB 빌드
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$UPLOAD_KEYSTORE_PATH"
          flutter build appbundle --release --android-project-arg=playUpload=true --build-number=$BUILD_NUMBER
          rm -f "$UPLOAD_KEYSTORE_PATH"
          cp build/app/outputs/bundle/release/app-release.aab english_step.aab

      # 항상 같은 주소(releases/latest/download/...)로 최신 APK를 받을 수 있게 릴리스를 새로 만든다.
      - name: 최신 APK 릴리스 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk english_step.apk
          FILES="english_step.apk"
          [ -f english_step.aab ] && FILES="$FILES english_step.aab"
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest $FILES \
            --target "$GITHUB_SHA" --latest \
            --title "영어 한 걸음 (빌드 $BUILD_NUMBER)" \
            --notes "폰에서 english_step.apk를 눌러 설치하세요. 처음 한 번 '출처를 알 수 없는 앱 설치 허용'이 필요할 수 있어요. 요즘 안드로이드폰(64비트)용입니다."
